name: Verificación

# Revisa el análisis estático y las pruebas en cada push y en cada pull
# request. No compila el APK: de eso se encarga "Build APK".
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Análisis y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version

      - run: flutter pub get

      # Barrera: frena por errores y advertencias. Los avisos informativos
      # no frenan nada (hoy son sobre todo deprecaciones de Flutter que
      # habría que migrar aparte).
      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      # Informativo: el código todavía no está pasado por dart format.
      - name: Formato (informativo)
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - name: Pruebas
        run: flutter test --reporter expanded
