name: Build APK

# Compila el APK en cada push a main y lo publica en la pestaña "Releases".
# También se puede lanzar a mano desde Actions → Build APK → Run workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Preparar android/ (generar si falta y asegurar audio en segundo plano)
        run: python3 tools/ci/prepare_android.py

      - name: Restaurar clave de firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && printf '%s' "$KEYSTORE_B64" | tr -d ' \n\r' | base64 -d > "$RUNNER_TEMP/release.keystore" 2>/dev/null; then
            mkdir -p ~/.android
            cp "$RUNNER_TEMP/release.keystore" ~/.android/debug.keystore
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Clave de firma restaurada:"
            keytool -list -v -keystore "$RUNNER_TEMP/release.keystore" -storepass android 2>/dev/null | grep -E "Owner|SHA256" || echo "::warning::El keystore no se pudo leer (¿secret mal pegado?). Se usará la firma por defecto."
          else
            echo "::warning::Sin clave fija válida: cada APK se firma con una clave distinta (para actualizar hay que desinstalar la versión anterior)."
          fi

      - run: flutter pub get

      - name: Análisis estático (informativo)
        run: flutter analyze
        continue-on-error: true

      - name: Compilar APK
        run: >-
          flutter build apk --release
          --target-platform android-arm64
          --build-number=${{ github.run_number }}
          --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - name: Mostrar firma del APK (informativo)
        continue-on-error: true
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Preparar archivo
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "Resonar-${TAG}.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "file=Resonar-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: resonar-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Resonar $TAG" \
              --notes "$(git log -1 --pretty=%s)"$'\n\n'"APK generado automáticamente desde el commit ${GITHUB_SHA::7}." \
              --target "$GITHUB_SHA"
          fi
