name: Build APK

# Compila el APK en cada push a main y lo publica en la pestaña "Releases".
# También se puede lanzar a mano desde Actions → Build APK → Run workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # necesario para crear la Release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Versión de Flutter
        run: flutter --version

      - name: Preparar android/ (generar si falta y asegurar audio en segundo plano)
        run: python3 tools/ci/prepare_android.py

      - name: Restaurar clave de firma (opcional)
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Clave de firma restaurada."
          else
            echo "Sin clave fija: cada APK se firma con una clave distinta (para actualizar hay que desinstalar la versión anterior)."
          fi

      - run: flutter pub get

      - name: Análisis estático (informativo)
        run: flutter analyze
        continue-on-error: true

      - name: Compilar APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Preparar archivo
        id: apk
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          cp build/app/outputs/flutter-apk/app-release.apk "reproductor-offline-${TAG}.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "file=reproductor-offline-${TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: reproductor-offline-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publicar Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --title "Reproductor FOSS $TAG" \
              --notes "APK generado automáticamente desde el commit ${GITHUB_SHA::7}." \
              --target "$GITHUB_SHA"
          fi
