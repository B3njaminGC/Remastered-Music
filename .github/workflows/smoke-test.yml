name: Smoke test

# Instala un APK publicado en un emulador y revisa que la app abra sin cerrarse.
# Se lanza a mano: Actions → Smoke test → Run workflow (tag: build-N o latest).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release a probar (build-N o latest)'
        default: latest

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Bajar el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ "$TAG" = "latest" ]; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output app.apk
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --output app.apk
          fi
          ls -l app.apk

      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell pm grant com.b3njamingc.play_music_app android.permission.READ_MEDIA_AUDIO || true
            adb shell pm grant com.b3njamingc.play_music_app android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell monkey -p com.b3njamingc.play_music_app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb shell pidof com.b3njamingc.play_music_app > pid.txt || true
            echo "=== PID ==="; cat pid.txt
            echo "=== ERRORES ==="
            grep -E "FATAL EXCEPTION|AndroidRuntime|Fatal signal|SIGSEGV|SIGABRT|E flutter|F DEBUG|Process .* has died|ClassNotFound|UnsatisfiedLink" logcat.txt | head -60 || true
            adb exec-out screencap -p > screen.png || true

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: |
            logcat.txt
            pid.txt
            screen.png
