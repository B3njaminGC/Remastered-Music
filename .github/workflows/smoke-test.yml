name: Smoke test

# Compila el código actual para x86_64, lo instala en un emulador y revisa que
# la app abra sin cerrarse. Se lanza a mano: Actions → Smoke test → Run workflow.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: python3 tools/ci/prepare_android.py

      - run: flutter pub get

      - name: Compilar para x86_64 (el emulador no corre arm64)
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-x64 && exit 0
            sleep 10
          done
          exit 1

      - name: Copiar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk app.apk

      - name: Probar en emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb shell pm grant com.b3njamingc.play_music_app android.permission.READ_MEDIA_AUDIO || true
            adb shell pm grant com.b3njamingc.play_music_app android.permission.POST_NOTIFICATIONS || true
            adb logcat -c
            adb shell monkey -p com.b3njamingc.play_music_app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb logcat -d > logcat.txt
            adb shell pidof com.b3njamingc.play_music_app > pid.txt || true
            echo "=== PID ==="; cat pid.txt
            echo "=== ERRORES ==="
            grep -E "FATAL EXCEPTION|flutter\\s*:|I flutter|AndroidRuntime|Fatal signal|SIGSEGV|SIGABRT|E flutter|F DEBUG|Process .* has died|ClassNotFound|UnsatisfiedLink" logcat.txt | head -60 || true
            adb exec-out screencap -p > screen.png || true

      - name: Subir resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-result
          path: |
            logcat.txt
            pid.txt
            screen.png
