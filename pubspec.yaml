name: play_music_app
description: "Reproductor de música 100% offline, de código abierto."
# Evita publicar el paquete por accidente en pub.dev.
publish_to: 'none'

# versión+build. En Android: versionName+versionCode.
version: 1.2.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Reproducción de audio (con notificación y controles en segundo plano)
  just_audio: ^0.9.36
  audio_service: ^0.18.18
  audio_session: ^0.1.25

  # Archivos, permisos y metadatos
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  audio_metadata_reader: ^1.8.1
  on_audio_query_pluse: 3.0.7
  url_launcher: ^6.3.0
  open_filex: ^4.7.0

  # Almacenamiento local
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.6

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
